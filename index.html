<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Landing Scene</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="scene">
  <div class="sky-glow"></div>
  <div class="stars" id="stars"></div>
  <div class="ground"><div class="ground-line"></div></div>
  <div class="box-shadow" id="boxShadow"></div>
  <div class="box" id="box">
    <div class="box-top"></div><div class="box-front"></div><div class="box-side"></div>
    <div class="box-mark">X</div>
  </div>
  <div class="person" id="person" aria-label="person">
    <div class="head"></div><div class="body"></div>
    <div class="arm arm-back"></div><div class="arm arm-front"></div>
    <div class="leg leg-back"></div><div class="leg leg-front"></div>
  </div>
  <div class="caption" id="caption">INCOMING</div>
</main>
<script src="script.js"></script>
</body>
</html>
