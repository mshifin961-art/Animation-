<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Energy Core</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="scene">
<div class="grid"></div>
<div class="core-wrap" id="coreWrap">
<div class="ring ring-a"></div><div class="ring ring-b"></div><div class="ring ring-c"></div>
<div class="core-glow"></div>
<div class="core" id="core"><div class="core-inner"></div></div>
<div class="charge-ring"></div>
</div>
<div class="particles" id="particles"></div>
<div class="shockwave" id="shockwave"></div>
<div class="hud">
<div class="title">ENERGY CORE</div>
<div class="status" id="status">TOUCH TO CHARGE</div>
<div class="meter"><span id="meterFill"></span></div>
<div class="percent" id="percent">0%</div>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
